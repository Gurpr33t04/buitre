<div class="content"><h1>东京旅游指南</h1><p>东京是日本的首都，也是人口最多的城市之一，这里既有历史悠久的寺庙，也有高度现代化的商业区和交通网络。</p><p>每年春天，成千上万的游客来到上野公园观赏樱花，当地居民也会在树下聚会，分享食物并庆祝新季节的到来。</p><p>城市的地铁系统被认为是世界上最准时的交通网络之一，高峰时段每隔两三分钟就有一班列车进站。</p></div>
